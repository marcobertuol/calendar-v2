<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Relógio & Calendário Minimalista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Configuração de Cores baseada no seu pedido (Branco + Verde Pastel Escuro) */
    :root {
      --bg: #ffffff;
      --bg-soft: #f8fafc; /* Um cinza muito sutil para contraste */
      --accent: #5F8D65;  /* O Verde Pastel Escuro solicitado */
      --accent-soft: #8bac8f; /* Variação mais clara */
      --text-main: #334155;   /* Cinza escuro para texto */
      --text-muted: #94a3b8;  /* Cinza claro para detalhes */
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); /* Sombra suave */
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .widget {
      min-width: 300px;
      max-width: 420px;
      width: 100%;
      background: var(--bg);
      border-radius: var(--radius);
      /* box-shadow: var(--shadow); Removido para ficar mais clean no embed, adicione se quiser destaque */
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Área do Relógio */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
    }

    .time-wrapper {
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    .time {
      font-size: 3.5rem;
      font-weight: 300; /* Mais fino/minimalista */
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .seconds {
      font-size: 1rem;
      margin-left: 8px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .date-full {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
      text-transform: capitalize;
      margin-top: 4px;
    }

    /* Separador decorativo */
    .divider {
      height: 4px;
      width: 40px;
      background-color: var(--accent);
      border-radius: 2px;
      opacity: 0.3;
      margin: 0 auto;
    }

    /* Área do Calendário */
    .calendar-card {
      background: var(--bg);
      /* border: 1px solid var(--border); Se quiser borda no calendário descomente */
      border-radius: 16px;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .calendar-header {
        display: none; /* Ocultando cabeçalho mês/ano pois já mostramos na data principal */
    }

    .calendar-grid-wrapper {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .calendar-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .weekday-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      padding-bottom: 4px;
    }

    .day-cell {
      font-size: 0.85rem;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text-main);
      position: relative;
      transition: background 0.2s;
    }

    .day-cell.empty {
      pointer-events: none;
    }

    /* Dia Atual */
    .day-cell.today {
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(95, 141, 101, 0.4);
    }

    /* Feriados */
    .day-cell.holiday::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      background-color: var(--accent-soft);
      border-radius: 50%;
    }
    
    .day-cell.today.holiday::after {
        background-color: white;
    }

    @media (max-width: 380px) {
      .time { font-size: 2.8rem; }
      .widget { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="widget" id="clock-widget">
    
    <!-- Seção Superior: Relógio e Data -->
    <div class="top-section">
      <div class="time-wrapper">
        <span class="time" id="time">--:--</span>
        <span class="seconds" id="seconds">--</span>
      </div>
      <div class="date-full" id="date-full">Carregando...</div>
    </div>

    <div class="divider"></div>

    <!-- Seção Inferior: Calendário -->
    <div class="calendar-card">
      <div class="calendar-grid-wrapper">
          <!-- Cabeçalho dos dias (D S T Q Q S S) -->
          <div class="calendar-row" id="calendar-weekdays"></div>
          <!-- Dias numéricos -->
          <div class="calendar-row" id="calendar-grid"></div>
      </div>
    </div>

  </div>

  <script>
    // Usando D S T Q Q S S para ficar igual ao seu pedido original
    const weekdayShort = ["D", "S", "T", "Q", "Q", "S", "S"];
    
    const monthNames = [
      "janeiro", "fevereiro", "março", "abril",
      "maio", "junho", "julho", "agosto",
      "setembro", "outubro", "novembro", "dezembro"
    ];

    const holidays = [
      { month: 0,  day: 1,  name: "Ano Novo" },
      { month: 3,  day: 21, name: "Tiradentes" },
      { month: 4,  day: 1,  name: "Trabalho" },
      { month: 8,  day: 7,  name: "Independência" },
      { month: 9,  day: 12, name: "N. Sra. Aparecida" },
      { month: 10, day: 2,  name: "Finados" },
      { month: 10, day: 15, name: "Proclamação Rep." },
      { month: 11, day: 25, name: "Natal" }
    ];

    const timeEl = document.getElementById("time");
    const secondsEl = document.getElementById("seconds");
    const dateFullEl = document.getElementById("date-full");
    const calendarWeekdaysEl = document.getElementById("calendar-weekdays");
    const calendarGridEl = document.getElementById("calendar-grid");

    function pad(n) {
      return n.toString().padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();
      const hours = pad(now.getHours());
      const mins = pad(now.getMinutes());
      const secs = pad(now.getSeconds());

      timeEl.textContent = `${hours}:${mins}`;
      secondsEl.textContent = secs; // Removido o 's' para ficar mais limpo

      const weekday = now.toLocaleDateString('pt-BR', { weekday: 'long' });
      const day = now.getDate();
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();

      // Formato: Segunda-feira, 18 de novembro de 2025
      dateFullEl.textContent = `${weekday}, ${day} de ${month} de ${year}`;
    }

    function buildWeekdays() {
      calendarWeekdaysEl.innerHTML = "";
      weekdayShort.forEach(w => {
        const d = document.createElement("div");
        d.className = "weekday-label";
        d.textContent = w;
        calendarWeekdaysEl.appendChild(d);
      });
    }

    function buildCalendar() {
      const now = new Date();
      calendarGridEl.innerHTML = "";

      const year = now.getFullYear();
      const month = now.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const totalDays = lastDay.getDate();

      // Ajuste para começar no Domingo (0) conforme array D S T Q Q S S
      const firstWeekday = firstDay.getDay(); 

      // Dias vazios antes do dia 1
      for (let i = 0; i < firstWeekday; i++) {
        const div = document.createElement("div");
        div.className = "day-cell empty";
        calendarGridEl.appendChild(div);
      }

      // Dias do mês
      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";
        cell.textContent = d;

        // Checar se é hoje
        if (d === now.getDate()) {
          cell.classList.add("today");
        }

        // Checar feriado
        const holiday = holidays.find(h => h.day === d && h.month === month);
        if (holiday) {
          cell.classList.add("holiday");
          cell.title = holiday.name;
        }

        calendarGridEl.appendChild(cell);
      }
    }

    function init() {
      buildWeekdays();
      buildCalendar();
      updateClock();
      setInterval(updateClock, 1000);
      // Atualizar calendário a cada minuto para virar o dia sem reload
      setInterval(buildCalendar, 60000); 
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
